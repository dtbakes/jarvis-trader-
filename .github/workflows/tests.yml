name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fully offline: Claude, OANDA and Telegram are faked in the tests,
      # so no secrets are needed and nothing can touch the trading account.
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Eval harness self-check (offline, scripted model)
        run: python -m evals.run_evals --offline

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
